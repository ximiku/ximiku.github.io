- title: Targeting PP6C as an Inhibitor of PP2A for Cancer Therapy
  type: talk_slides
  date: May 2024
  context: course report
  description: PP2A is a tumor suppressor that is often inactivated in cancer. This presentation investigates the potential of targeting PP6C, a regulatory subunit of PP2A, as an inhibitor to restore PP2A activity and suppress tumor growth, offering a novel approach for cancer therapy.
