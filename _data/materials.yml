- title: A time-resolved, multi-symbol molecular recorder via sequential genome editing
  type: talk_slides
  date: Jun 2026
  context: UHPB Journal Club
  description: DNA Typewriter records the temporal order of cellular events by sequentially writing event barcodes into a genomic DNA tape through prime editing. This enables cells to store multi-symbol histories in a stable, heritable, and single-cell-readable form.
