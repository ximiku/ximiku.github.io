- title: Brain on Fire —— Focus on rare neurological disorders
  type: talk_slides
  date: May 2024
  context: course report
  description: Brain on Fire is a memoir by Susannah Cahalan that chronicles her experience with a rare autoimmune neurological disorder called anti-NMDA receptor encephalitis. This presentation focuses on the clinical features, diagnosis, and treatment of this disorder, as well as the broader implications for understanding rare neurological diseases.
