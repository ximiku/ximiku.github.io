- title: Reduce the risk of CAR-T cell therapy with click chemistry
  type: talk_slides
  date: May 2024
  context: course report
  description: CAR-T cell therapy is a promising treatment for certain cancers, but it can cause severe side effects. This presentation explores how click chemistry can be used to modify CAR-T cells, potentially reducing the risks associated with this therapy and improving patient outcomes.
