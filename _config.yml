# -----------------------------------------------------------------------------
# 站点基础设置
# -----------------------------------------------------------------------------

title: Jiaxi Liu # 网站标题；设为 blank 时会自动使用 first_name + last_name
first_name: Jiaxi
middle_name:
last_name: Liu
description: > # ">" 表示把下面多行合并为一段文本
  Academic personal homepage of Jiaxi Liu, an undergraduate student in Bioinformatics at Peking University.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: bioinformatics, protein language model, biomedical AI, Peking University, academic website
lang: en # 网站语言代码；例如 en、zh、fr
icon: 🧬 # favicon 图标；也可以改成 assets/img/ 下的图片文件名

url: https://ximiku.github.io # 网站的域名和协议
baseurl: # 个人主页通常留空；项目站点才填写 /repo-name/
last_updated: false # 是否在页脚显示最后更新时间
impressum_path: # 如需 GDPR/Impressum 链接，可填对应页面 permalink
back_to_top: true # 是否显示返回顶部按钮

# -----------------------------------------------------------------------------
# 主题
# -----------------------------------------------------------------------------

# GitHub 仓库卡片配色；当前主页没有仓库页，可保留默认值
repo_theme_light: default # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_theme_dark: dark # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_trophies:
  enabled: true
  theme_light: flat # https://github.com/ryo-ma/github-profile-trophy
  theme_dark: gitdimmed # https://github.com/ryo-ma/github-profile-trophy

# 仓库页使用的外部服务地址；当前主页没有仓库页，可保留默认值
external_services:
  github_readme_stats_url: https://github-readme-stats.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

# -----------------------------------------------------------------------------
# RSS 订阅
# -----------------------------------------------------------------------------
# RSS 会使用 title 和 url；更多配置见 jekyll-feed 文档

# -----------------------------------------------------------------------------
# 布局
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false
search_enabled: true
socials_in_search: true
posts_in_search: true

# 页面宽度
max_width: 930px

# -----------------------------------------------------------------------------
# Open Graph 与 Schema.org
# -----------------------------------------------------------------------------
# 社交平台分享预览；如需要，可启用 Open Graph / Schema.org 元信息
serve_og_meta: false # 是否在 HTML head 中加入 Open Graph 标签
serve_schema_org: false # 是否在 HTML head 中加入 Schema.org 标签
og_image: # 全站默认分享预览图路径

# -----------------------------------------------------------------------------
# 统计与搜索引擎验证
# -----------------------------------------------------------------------------

# 如需统计访问量，在这里填写对应服务的 ID；不开启时留空即可
google_analytics: # Google Analytics 衡量 ID，格式如 G-XXXXXXXXXX
cronitor_analytics: # Cronitor RUM 站点 ID，格式如 XXXXXXXXX
pirsch_analytics: # Pirsch 站点 ID，通常为 32 位字符
openpanel_analytics: # Openpanel 客户端 ID，格式如 XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX

# 搜索引擎站点验证 ID；不需要时留空
google_site_verification: # Google Search Console 验证 ID
bing_site_verification: # Bing Webmaster 验证 ID

# Giscus 评论；如需启用评论，先在 https://giscus.app/ 配置仓库后再填写
giscus:
  repo: # 格式为 <GitHub用户名>/<仓库名>
  repo_id: # 可留空，也可填写 giscus 生成的 repo_id
  category: Comments # 评论讨论所在的 GitHub Discussion 分类名
  category_id: # 可留空，也可填写 giscus 生成的 category_id
  mapping: title # 按页面标题匹配讨论
  strict: 1 # 是否使用严格匹配模式
  reactions_enabled: 1 # 是否启用 emoji reactions；1 为启用，0 为关闭
  input_position: bottom # 评论输入框位置：bottom 或 top
  dark_theme: dark # 暗色模式主题名
  light_theme: light # 亮色模式主题名
  emit_metadata: 0
  lang: en

# -----------------------------------------------------------------------------
# Jekyll 设置
# -----------------------------------------------------------------------------

# Markdown 与代码高亮
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Jekyll 构建时包含/排除的文件
include: ["_pages", "_scripts"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

# 插件
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

# Sitemap 设置
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# -----------------------------------------------------------------------------
# Jekyll Minifier
# -----------------------------------------------------------------------------

jekyll-minifier:
  compress_javascript: false # JS 压缩交给 terser 处理，因此这里保持 false
  exclude: ["robots.txt", "assets/js/search/*.js"]

# -----------------------------------------------------------------------------
# Terser
# -----------------------------------------------------------------------------

terser:
  compress:
    drop_console: true

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: [Liu]
  first_name: [Jiaxi, J.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # 如果 BibTeX 中包含 LaTeX 数学公式，latex 预处理可能和 MathJAX 冲突。
  # 参考：https://github.com/alshedivat/al-folio/issues/357
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

# 论文条目右侧的引用/指标徽章；可在 _layouts/bib.liquid 中进一步定制
enable_publication_badges:
  altmetric: true # Altmetric 徽章
  dimensions: true # Dimensions 徽章
  google_scholar: true # Google Scholar 徽章
  inspirehep: true # Inspire HEP 徽章

# 从 BibTeX 输出中隐藏这些站内使用的字段
filtered_bibtex_keywords:
  [
    abbr,
    abstract,
    additional_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award_name,
    bibtex_show,
    blog,
    code,
    dimensions,
    doi_button,
    equal_contribution,
    eprint,
    google_scholar_id,
    hal,
    html,
    impact_factor,
    impact_factor_year,
    inspirehep_id,
    jcr,
    ccf,
    pdf,
    pmid,
    pmcid,
    poster,
    preview,
    pubmed,
    corresponding_author,
    selected,
    slides,
    supp,
    url,
    video,
    website,
  ]

# 每篇论文默认显示的作者数量；留空则显示全部作者
max_author_limit: 10
more_authors_animation_delay: 10 # 点击展开更多作者时的动画延迟；数值越小越快

# 是否显示论文预览图；关闭后即使 BibTeX 里写了 preview 也不会显示
enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Jekyll 链接属性
# -----------------------------------------------------------------------------

# 外部链接默认属性
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# 响应式 WebP 图片
# -----------------------------------------------------------------------------

# 启用前请确保 ImageMagick 已安装并在 PATH 中；终端可运行：
#   convert -version
imagemagick:
  enabled: true # 是否为图片生成响应式 WebP 版本
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".gif"
  output_formats:
    webp: "-auto-orient -quality 85"

# 图片懒加载。启用后图片会默认加上 loading="lazy"，首屏外图片加载更快。
# 可选值包括 "auto"、"eager"、"lazy"。
lazy_loading_images: true

# -----------------------------------------------------------------------------
# 可选功能
# -----------------------------------------------------------------------------

enable_google_analytics: false # 是否启用 Google Analytics
enable_cronitor_analytics: false # 是否启用 Cronitor RUM analytics
enable_pirsch_analytics: false # 是否启用 Pirsch analytics
enable_openpanel_analytics: false # 是否启用 Openpanel analytics
enable_google_verification: false # 是否启用 Google 站点验证
enable_bing_verification: false # 是否启用 Bing 站点验证
enable_cookie_consent: false # 是否启用 GDPR cookie 同意弹窗
enable_masonry: false # 项目卡片瀑布流；当前没有项目页，关闭
enable_math: true # 是否启用 MathJAX 数学公式
enable_tooltips: false # 是否为页面标题自动生成 tooltip 链接
enable_darkmode: true # 是否启用明暗模式切换
enable_navbar_social: false # 是否在导航栏显示社交链接；当前放在头像下方
enable_project_categories: false # 项目分类；当前没有项目页，关闭
enable_medium_zoom: true # 是否启用图片点击放大
enable_progressbar: true # 是否启用顶部滚动进度条
enable_video_embedding: false # BibTeX 视频字段是否内嵌播放；关闭时按钮会打开新窗口

